<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ORBITAL</title>

<!-- iOS Webapp -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORBITAL">
<meta name="theme-color" content="#03060f">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%2303060f'/><text y='120' x='90' text-anchor='middle' font-size='100'>🛸</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:     #03060f;
  --s1:     #080e1f;
  --s2:     #0c1428;
  --s3:     #111c38;
  --border: rgba(80,140,255,0.13);
  --blue:   #4d9fff;
  --orange: #ff6c36;
  --green:  #39e87b;
  --yellow: #f5c842;
  --text:   #dce8ff;
  --muted:  #5a6e9a;
  --dim:    #38496e;
  --mono:   'DM Mono', monospace;
  --disp:   'Bebas Neue', sans-serif;
  --body:   'DM Sans', sans-serif;
  --sat: env(safe-area-inset-top,    0px);
  --sar: env(safe-area-inset-right,  0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left,   0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: -webkit-fill-available; }

body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

/* ─── STARFIELD ──────────────────────────────────────── */
#stars { position:fixed; inset:0; z-index:0; pointer-events:none; }

/* ─── APP SHELL ──────────────────────────────────────── */
#app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100vh;
  height: -webkit-fill-available;
  padding-top: var(--sat);
  padding-left: var(--sal);
  padding-right: var(--sar);
}

/* ─── HEADER ─────────────────────────────────────────── */
header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px 14px;
  border-bottom: 1px solid var(--border);
  background: rgba(3,6,15,0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.wordmark { font-family: var(--disp); font-size: 28px; letter-spacing: 0.12em;
  background: linear-gradient(110deg, var(--blue) 0%, #9b7aff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1; }
.wordmark-sub { font-family: var(--mono); font-size: 8px; letter-spacing: 0.2em;
  color: var(--muted); text-transform: uppercase; margin-top: 3px; }

.header-right { display:flex; align-items:center; gap:14px; }

.live-pill { display:flex; align-items:center; gap:5px;
  background: rgba(57,232,123,0.08); border:1px solid rgba(57,232,123,0.2);
  border-radius:20px; padding:4px 9px;
  font-family:var(--mono); font-size:9px; color:var(--green); letter-spacing:0.12em; }
.live-dot { width:6px; height:6px; border-radius:50%; background:var(--green);
  animation: blink 2s ease-in-out infinite; }
@keyframes blink {
  0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(57,232,123,0.5); }
  50%      { opacity:.4; box-shadow:0 0 0 5px rgba(57,232,123,0); }
}

#utc-clock { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.1em; }

/* ─── SCROLL AREA ────────────────────────────────────── */
#scroller {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding: 16px 16px calc(16px + var(--sab));
}

/* Desktop: bigger padding */
@media (min-width: 769px) {
  #scroller { padding: 20px 24px calc(20px + var(--sab)); }
}

/* ─── STAT STRIP ─────────────────────────────────────── */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.stat-tile {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  position: relative; overflow: hidden;
}
.stat-tile::after { content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--ta, var(--blue)); opacity:.7; }
.stat-tile:nth-child(1){--ta:var(--blue)}
.stat-tile:nth-child(2){--ta:var(--orange)}
.stat-tile:nth-child(3){--ta:var(--green)}
.stat-tile:nth-child(4){--ta:var(--yellow)}

.stat-n { font-family:var(--disp); font-size:34px; letter-spacing:0.04em;
  color:var(--ta,var(--blue)); line-height:1; margin-bottom:4px; }
.stat-l { font-size:11px; color:var(--muted); font-weight:500; }

/* ─── GRID ───────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 320px;
  gap: 12px;
}

/* ─── CARD ───────────────────────────────────────────── */
.card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
.card::before { content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse at 0% 0%, rgba(77,159,255,0.04), transparent 60%);
  pointer-events:none; }

.eyebrow { font-family:var(--mono); font-size:8px; letter-spacing:0.22em;
  color:var(--muted); text-transform:uppercase; margin-bottom:12px;
  display:flex; align-items:center; gap:8px; }
.eyebrow::before { content:''; display:block; width:14px; height:1px;
  background:var(--ca, var(--blue)); }

.card-title { font-family:var(--disp); font-size:18px; letter-spacing:0.08em;
  color:var(--text); margin-bottom:16px; }

/* ─── COUNTDOWN ──────────────────────────────────────── */
#card-next { --ca: var(--orange); }

.cd-row { display:flex; gap:8px; margin-bottom:18px; }
.cd-unit { flex:1; background:var(--s2); border:1px solid var(--border);
  border-radius:10px; padding:10px 4px; text-align:center; }
.cd-n { font-family:var(--disp); font-size:32px; letter-spacing:0.04em;
  color:var(--orange); line-height:1; display:block; }
.cd-l { font-family:var(--mono); font-size:7px; letter-spacing:0.18em;
  color:var(--muted); text-transform:uppercase; margin-top:4px; display:block; }

.drow { display:flex; justify-content:space-between; align-items:center;
  padding:8px 0; border-bottom:1px solid var(--border); gap:8px; }
.drow:last-child { border-bottom:none; }
.dk { font-family:var(--mono); font-size:8px; color:var(--muted);
  letter-spacing:0.14em; text-transform:uppercase; flex-shrink:0; }
.dv { font-size:12px; font-weight:600; text-align:right; }

/* ─── BADGES ─────────────────────────────────────────── */
.bdg { display:inline-flex; align-items:center; padding:2px 8px;
  border-radius:20px; font-family:var(--mono); font-size:8px; letter-spacing:0.1em; }
.bdg-go   { background:rgba(57,232,123,0.1);  color:var(--green);  border:1px solid rgba(57,232,123,0.25); }
.bdg-tbd  { background:rgba(245,200,66,0.1);  color:var(--yellow); border:1px solid rgba(245,200,66,0.25); }
.bdg-ok   { background:rgba(77,159,255,0.1);  color:var(--blue);   border:1px solid rgba(77,159,255,0.25); }
.bdg-fail { background:rgba(255,80,80,0.1);   color:#ff5555;       border:1px solid rgba(255,80,80,0.25); }

/* ─── LAUNCH LIST ────────────────────────────────────── */
#card-list { --ca: var(--blue); }

.list-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:var(--s3) transparent;
  margin:0 -4px; padding:0 4px; }
.list-scroll::-webkit-scrollbar { width:3px; }
.list-scroll::-webkit-scrollbar-thumb { background:var(--s3); border-radius:3px; }

.lrow { display:flex; align-items:flex-start; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--border); }
.lrow:last-child { border-bottom:none; }
.lidx { font-family:var(--mono); font-size:9px; color:var(--dim);
  min-width:18px; padding-top:2px; }
.lbody { flex:1; min-width:0; }
.lname { font-weight:600; font-size:13px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; }
.ltags { display:flex; flex-wrap:wrap; gap:4px;
  font-family:var(--mono); font-size:8px; color:var(--muted); }
.ltag { background:var(--s2); border:1px solid var(--border);
  border-radius:4px; padding:2px 6px; }
.ltime { font-family:var(--mono); font-size:8px; color:var(--blue);
  background:rgba(77,159,255,0.07); border:1px solid rgba(77,159,255,0.15);
  border-radius:6px; padding:4px 6px; white-space:pre; text-align:right;
  align-self:flex-start; flex-shrink:0; line-height:1.5; }

/* ─── ISS ────────────────────────────────────────────── */
#card-iss { --ca: var(--green); }

.map-wrap { width:100%; aspect-ratio:16/10; border-radius:10px; overflow:hidden;
  background:#040b1c; border:1px solid var(--border); margin-bottom:14px; flex-shrink:0; }
#iss-svg { width:100%; height:100%; display:block; }

.iss-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.iss-tile { background:var(--s2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; }
.iss-tl { font-family:var(--mono); font-size:7px; color:var(--muted);
  letter-spacing:0.16em; text-transform:uppercase; margin-bottom:4px; }
.iss-tv { font-family:var(--disp); font-size:18px; letter-spacing:0.04em;
  color:var(--green); line-height:1; }
.iss-tu { font-family:var(--mono); font-size:8px; color:var(--muted); }

.crew-ttl { font-family:var(--mono); font-size:8px; letter-spacing:0.2em;
  color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
.crew-list { display:flex; flex-direction:column; gap:5px; }
.crew-item { display:flex; align-items:center; gap:9px;
  background:var(--s2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; }
.crew-av { width:24px; height:24px; border-radius:50%;
  background:linear-gradient(135deg,var(--blue),#7c5cfc);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:#fff; flex-shrink:0; }
.crew-name { font-size:12px; font-weight:600; flex:1; }
.crew-craft { font-family:var(--mono); font-size:7px; color:var(--muted); }

/* ─── SKELETON ───────────────────────────────────────── */
.sk { background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);
  background-size:300% 100%; animation:shim 1.6s infinite;
  border-radius:5px; height:12px; margin:7px 0; }
@keyframes shim { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.err { font-family:var(--mono); font-size:9px; color:#ff6060; padding:10px;
  background:rgba(255,60,60,0.06); border:1px solid rgba(255,60,60,0.18);
  border-radius:8px; line-height:1.6; }

/* ─── MOBILE NAV ─────────────────────────────────────── */
#mob-nav {
  display: none;
  flex-shrink: 0;
  background: rgba(8,14,31,0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid rgba(80,140,255,0.2);
  padding: 8px 0 calc(8px + var(--sab));
}

.nav-tabs { display:flex; justify-content:space-around; }

.ntab { display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--muted);
  font-family:var(--mono); font-size:8px; letter-spacing:0.1em;
  text-transform:uppercase; padding:6px 20px; cursor:pointer;
  -webkit-tap-highlight-color:transparent; transition:color .18s; }
.ntab.on { color:var(--blue); }
.ntab-icon { font-size:22px; line-height:1; }

/* ─── RESPONSIVE ─────────────────────────────────────── */

/* Tablet */
@media (max-width:1080px) and (min-width:769px) {
  .grid { grid-template-columns: 1fr 1fr; }
  #card-iss { grid-column: 1/3; }
  .map-wrap { aspect-ratio:21/9; }
  .iss-grid { grid-template-columns:repeat(4,1fr); }
  .crew-list { flex-direction:row; flex-wrap:wrap; }
  .crew-item { flex:1; min-width:140px; }
}

/* Mobile */
@media (max-width:768px) {
  header { padding: 12px 16px 10px; }
  #utc-clock { display: none; }
  .wordmark { font-size: 24px; }

  .stat-strip { grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .stat-n { font-size:26px; }
  .stat-tile { padding:11px 13px; }

  .grid { display:block; }

  /* Mobile: one panel at a time */
  .card { display:none; }
  .card.show { display:flex; }

  #mob-nav { display:block; }

  /* No internal scrolling on mobile — let #scroller handle it */
  .list-scroll { max-height:none; overflow:visible; }

  .map-wrap { aspect-ratio:16/9; }
  .iss-grid { gap:6px; }
}

/* Large desktop */
@media (min-width:769px) {
  .card { display:flex !important; }
  #mob-nav { display:none !important; }
  .list-scroll { max-height:400px; }
  #card-iss { grid-column:3; grid-row:1/3; }
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="app">
  <header>
    <div>
      <div class="wordmark">ORBITAL</div>
      <div class="wordmark-sub">Space Mission Dashboard</div>
    </div>
    <div class="header-right">
      <div class="live-pill"><div class="live-dot"></div>LIVE</div>
      <div id="utc-clock"></div>
    </div>
  </header>

  <div id="scroller">
    <!-- STATS -->
    <div class="stat-strip">
      <div class="stat-tile"><div class="stat-n" id="s-up">—</div><div class="stat-l">Upcoming Launches</div></div>
      <div class="stat-tile"><div class="stat-n" id="s-alt">—</div><div class="stat-l">ISS Altitude km</div></div>
      <div class="stat-tile"><div class="stat-n" id="s-crew">—</div><div class="stat-l">People in Space</div></div>
      <div class="stat-tile"><div class="stat-n" id="s-spd">—</div><div class="stat-l">ISS Speed km/h</div></div>
    </div>

    <!-- GRID -->
    <div class="grid">

      <!-- NEXT LAUNCH -->
      <div class="card show" id="card-next">
        <div class="eyebrow">Next US Launch</div>
        <div class="card-title" id="next-name">Loading…</div>
        <div class="cd-row">
          <div class="cd-unit"><span class="cd-n" id="cd-d">--</span><span class="cd-l">Days</span></div>
          <div class="cd-unit"><span class="cd-n" id="cd-h">--</span><span class="cd-l">Hrs</span></div>
          <div class="cd-unit"><span class="cd-n" id="cd-m">--</span><span class="cd-l">Min</span></div>
          <div class="cd-unit"><span class="cd-n" id="cd-s">--</span><span class="cd-l">Sec</span></div>
        </div>
        <div id="next-det">
          <div class="sk"></div><div class="sk" style="width:75%"></div>
          <div class="sk" style="width:85%"></div><div class="sk" style="width:60%"></div>
        </div>
      </div>

      <!-- LAUNCH LIST -->
      <div class="card" id="card-list">
        <div class="eyebrow">Mission Schedule</div>
        <div class="card-title">Upcoming Launches</div>
        <div class="list-scroll" id="list-body">
          <div class="sk"></div><div class="sk" style="width:80%"></div>
          <div class="sk"></div><div class="sk" style="width:65%"></div>
        </div>
      </div>

      <!-- ISS -->
      <div class="card" id="card-iss">
        <div class="eyebrow">Live Position</div>
        <div class="card-title">Space Station</div>
        <div class="map-wrap">
          <svg id="iss-svg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid meet">
            <rect width="400" height="220" fill="#040b1c"/>
            <g id="land"></g>
            <line x1="0" y1="110" x2="400" y2="110" stroke="rgba(77,159,255,0.07)" stroke-width=".5"/>
            <line x1="200" y1="0" x2="200" y2="220" stroke="rgba(77,159,255,0.07)" stroke-width=".5"/>
            <line x1="0" y1="55" x2="400" y2="55" stroke="rgba(77,159,255,0.04)" stroke-width=".5" stroke-dasharray="2,4"/>
            <line x1="0" y1="165" x2="400" y2="165" stroke="rgba(77,159,255,0.04)" stroke-width=".5" stroke-dasharray="2,4"/>
            <polyline id="iss-track" points="" stroke="rgba(255,108,54,0.3)" stroke-width="1" fill="none" stroke-dasharray="2,3"/>
            <defs>
              <filter id="oglow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="2.5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <circle id="iss-dot" cx="200" cy="110" r="5" fill="#ff6c36" filter="url(#oglow)"/>
            <text x="5" y="107" fill="rgba(77,159,255,0.22)" font-size="6" font-family="monospace">EQ</text>
            <text x="5" y="53" fill="rgba(77,159,255,0.18)" font-size="5.5" font-family="monospace">+51°</text>
            <text x="5" y="169" fill="rgba(77,159,255,0.18)" font-size="5.5" font-family="monospace">-51°</text>
          </svg>
        </div>
        <div class="iss-grid">
          <div class="iss-tile"><div class="iss-tl">Latitude</div><div class="iss-tv" id="iss-lat">—<span class="iss-tu">°</span></div></div>
          <div class="iss-tile"><div class="iss-tl">Longitude</div><div class="iss-tv" id="iss-lon">—<span class="iss-tu">°</span></div></div>
          <div class="iss-tile"><div class="iss-tl">Altitude</div><div class="iss-tv" id="iss-alt">—<span class="iss-tu">km</span></div></div>
          <div class="iss-tile"><div class="iss-tl">Speed</div><div class="iss-tv" id="iss-spd">—<span class="iss-tu">km/s</span></div></div>
        </div>
        <div class="crew-ttl">Current Crew</div>
        <div class="crew-list" id="crew-list">
          <div class="sk" style="height:34px;border-radius:8px"></div>
          <div class="sk" style="height:34px;border-radius:8px;width:80%"></div>
        </div>
      </div>

    </div><!-- /grid -->
  </div><!-- /scroller -->

  <!-- MOBILE BOTTOM NAV -->
  <nav id="mob-nav">
    <div class="nav-tabs">
      <button class="ntab on" data-id="card-next" onclick="switchTab(this)">
        <span class="ntab-icon">🚀</span>Next
      </button>
      <button class="ntab" data-id="card-list" onclick="switchTab(this)">
        <span class="ntab-icon">📋</span>Schedule
      </button>
      <button class="ntab" data-id="card-iss" onclick="switchTab(this)">
        <span class="ntab-icon">🛸</span>ISS
      </button>
    </div>
  </nav>
</div>

<script>
/* ── MOBILE TAB SWITCH ─────────────────────────────── */
function switchTab(btn) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('show'));
  document.querySelectorAll('.ntab').forEach(b => b.classList.remove('on'));
  document.getElementById(btn.dataset.id).classList.add('show');
  btn.classList.add('on');
  document.getElementById('scroller').scrollTop = 0;
}

/* ── STARFIELD ─────────────────────────────────────── */
(function(){
  const c=document.getElementById('stars'), ctx=c.getContext('2d');
  let W,H,S=[];
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  function init(){
    resize();
    S=Array.from({length:180},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.1+0.2,
      ph:Math.random()*Math.PI*2,
      sp:Math.random()*0.4+0.1
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    S.forEach(s=>{
      const a=(Math.sin(s.ph+t*s.sp*.001)+1)/2;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(180,210,255,${a*.6})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',init);
  init(); requestAnimationFrame(draw);
})();

/* ── CLOCK ─────────────────────────────────────────── */
(function tick(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  document.getElementById('utc-clock').textContent=
    `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
  setTimeout(tick,1000);
})();

/* ── WORLD MAP ─────────────────────────────────────── */
(function(){
  const W=400, H=220;
  const p=(ln,lt)=>`${((ln+180)*(W/360)).toFixed(1)},${((90-lt)*(H/180)).toFixed(1)}`;
  const shapes=[
    // North America

/* ── ISS ───────────────────────────────────────────── */
let track=[];
async function fetchISS(){
  try {
    const r=await fetch('https://api.wheretheiss.at/v1/satellites/25544');
    const d=await r.json();
    const lat=parseFloat(d.latitude), lon=parseFloat(d.longitude);
    const alt=parseFloat(d.altitude).toFixed(1);
    const spd=parseFloat(d.velocity/1000).toFixed(2);
    const kmh=Math.round(parseFloat(d.velocity));

    document.getElementById('iss-lat').innerHTML=`${lat.toFixed(2)}<span class="iss-tu">°</span>`;
    document.getElementById('iss-lon').innerHTML=`${lon.toFixed(2)}<span class="iss-tu">°</span>`;
    document.getElementById('iss-alt').innerHTML=`${alt}<span class="iss-tu">km</span>`;
    document.getElementById('iss-spd').innerHTML=`${spd}<span class="iss-tu">km/s</span>`;
    document.getElementById('s-alt').textContent=alt;
    document.getElementById('s-spd').textContent=kmh;

    const x=((lon+180)*(400/360)).toFixed(1);
    const y=((90-lat)*(220/180)).toFixed(1);
    document.getElementById('iss-dot').setAttribute('cx',x);
    document.getElementById('iss-dot').setAttribute('cy',y);
    track.push([x,y]);
    if(track.length>90) track.shift();
    document.getElementById('iss-track').setAttribute('points',
      track.map(p=>`${p[0]},${p[1]}`).join(' '));
  } catch(e){}
}

async function fetchCrew(){
  try {
    const r=await fetch('https://api.open-notify.org/astros.json');
    const d=await r.json();
    document.getElementById('s-crew').textContent=d.number;
    document.getElementById('crew-list').innerHTML=d.people.map(p=>`
      <div class="crew-item">
        <div class="crew-av">${p.name.charAt(0)}</div>
        <span class="crew-name">${p.name}</span>
        <span class="crew-craft">${p.craft}</span>
      </div>`).join('');
  } catch(e){
    document.getElementById('crew-list').innerHTML='<div class="err">Crew data unavailable.</div>';
  }
}

/* ── LAUNCHES ──────────────────────────────────────── */
function badge(ab){
  const m={Go:'bdg-go',TBD:'bdg-tbd',TBC:'bdg-tbd','In Flight':'bdg-go',Success:'bdg-ok',Failure:'bdg-fail'};
  return `<span class="bdg ${m[ab]||'bdg-tbd'}">${ab||'TBD'}</span>`;
}

function fDate(iso){
  if(!iso) return 'TBD';
  try {
    const d=new Date(iso);
    const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const hr=d.getUTCHours(), mn=d.getUTCMinutes();
    return `${mo[d.getUTCMonth()]} ${d.getUTCDate()}\n${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')} UTC`;
  } catch { return 'TBD'; }
}

let cdInterval=null;
function startCD(iso){
  if(cdInterval) clearInterval(cdInterval);
  function tick(){
    const diff=new Date(iso)-Date.now();
    if(diff<=0){ ['cd-d','cd-h','cd-m','cd-s'].forEach(id=>document.getElementById(id).textContent='00'); return; }
    const d=Math.floor(diff/86400000);
    const h=Math.floor(diff%86400000/3600000);
    const m=Math.floor(diff%3600000/60000);
    const s=Math.floor(diff%60000/1000);
    const p=n=>String(n).padStart(2,'0');
    document.getElementById('cd-d').textContent=p(d);
    document.getElementById('cd-h').textContent=p(h);
    document.getElementById('cd-m').textContent=p(m);
    document.getElementById('cd-s').textContent=p(s);
  }
  tick(); cdInterval=setInterval(tick,1000);
}

function renderNext(l){
  document.getElementById('next-name').textContent=l.name||'Unknown Mission';
  startCD(l.net);
  document.getElementById('next-det').innerHTML=`
    <div class="drow"><span class="dk">Status</span><span class="dv">${badge(l.status?.abbrev)}</span></div>
    <div class="drow"><span class="dk">T-Zero</span><span class="dv" style="white-space:pre-line;font-size:11px">${fDate(l.net)}</span></div>
    <div class="drow"><span class="dk">Provider</span><span class="dv">${l.launch_service_provider?.name||'—'}</span></div>
    <div class="drow"><span class="dk">Vehicle</span><span class="dv">${l.rocket?.configuration?.name||'—'}</span></div>
    <div class="drow"><span class="dk">Pad</span><span class="dv">${l.pad?.name||'—'}</span></div>
    <div class="drow"><span class="dk">Mission</span><span class="dv">${l.mission?.name||l.name||'—'}</span></div>
  `;
}

function renderList(list){
  document.getElementById('list-body').innerHTML=list.map((l,i)=>`
    <div class="lrow">
      <span class="lidx">${String(i+1).padStart(2,'0')}</span>
      <div class="lbody">
        <div class="lname">${l.name}</div>
        <div class="ltags">
          <span class="ltag">${l.rocket?.configuration?.name||'—'}</span>
          <span class="ltag">${l.pad?.location?.name||'—'}</span>
          ${badge(l.status?.abbrev)}
        </div>
      </div>
      <div class="ltime">${fDate(l.net)}</div>
    </div>`).join('');
}

async function fetchLaunches(){
  const urls=[
    'https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=15&location__ids=12,27,143,106&ordering=net&mode=list',
    'https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=12&ordering=net&mode=list'
  ];
  for(const url of urls){
    try {
      const r=await fetch(url);
      if(!r.ok) continue;
      const d=await r.json();
      const list=d.results;
      if(!list?.length) continue;
      document.getElementById('s-up').textContent=d.count||list.length;
      renderNext(list[0]);
      renderList(list.slice(1,13));
      return;
    } catch(e){ continue; }
  }
  document.getElementById('next-name').textContent='Rate Limited';
  document.getElementById('next-det').innerHTML='<div class="err">TheSpaceDevs API is rate-limited on the free tier (~15 req/hr). Refresh in a few minutes.</div>';
  document.getElementById('list-body').innerHTML='<div class="err">Launch data unavailable. Try again shortly.</div>';
}
